name: Runtime checks

on:
  pull_request:
  push:

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13', '3.14']
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install uv
      - run: uv sync --frozen --all-extras
      - name: All configured lint rules
        run: uv run ruff check src tests evals
      - run: uv run ruff format --check src tests evals
      - run: uv run mypy src
      - run: uv run pytest -q
      - run: uv build
      - name: Install and smoke-test base wheel outside source tree
        run: |
          uv venv /tmp/kalash-wheel --python '${{ matrix.python }}'
          uv pip install --python /tmp/kalash-wheel/bin/python dist/*.whl
          cd /tmp
          env -u PYTHONPATH /tmp/kalash-wheel/bin/python "$GITHUB_WORKSPACE/evals/wheel_smoke.py"
