[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kalash-code"
version = "0.1.0"
description = "Terminal-native, fully agentic coding assistant with multi-provider memory infrastructure"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Kalash Team" }]
keywords = ["ai", "agent", "coding", "memory", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development",
]

dependencies = [
    "httpx>=0.27.0,<1.0",
    "pydantic>=2.7.0,<3.0",
    "typer>=0.12.0,<1.0",
    "rich>=13.7.0,<14.0",
    "textual>=0.70.0,<1.0",
    "structlog>=24.1.0,<25.0",
    "pyyaml>=6.0,<7.0",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.34.0,<1.0"]
openai = ["openai>=1.40.0,<2.0"]
google = ["google-genai>=1.0.0,<2.0"]
bedrock = ["boto3>=1.34.0,<2.0"]
otel = ["opentelemetry-api>=1.25.0,<2.0", "opentelemetry-sdk>=1.25.0,<2.0"]
artifacts = [
    "pypdf>=6.0,<7.0",
    "reportlab>=4.0,<5.0",
    "python-docx>=1.1,<2.0",
    "openpyxl>=3.1,<4.0",
    "python-pptx>=1.0,<2.0",
    "pillow>=11.0,<13.0",
]
all = [
    "kalash-code[anthropic]",
    "kalash-code[openai]",
    "kalash-code[google]",
    "kalash-code[bedrock]",
    "kalash-code[otel]",
    "kalash-code[artifacts]",
]
dev = [
    "pytest>=8.2.0,<9.0",
    "pytest-asyncio>=0.23.0,<1.0",
    "hypothesis>=6.100.0,<7.0",
    "syrupy>=4.6.0,<5.0",
    "mypy>=1.10.0,<2.0",
    "types-pyyaml>=6.0,<7.0",
    "ruff>=0.5.0,<1.0",
    "coverage>=7.5.0,<8.0",
]

[project.scripts]
kalash = "kalash.cli.main:app"

[project.entry-points."kalash.memory_providers"]
local = "kalash.memory.providers.local:create_local_provider"

[project.entry-points."kalash.model_providers"]
anthropic = "kalash.models.providers.anthropic:AnthropicProvider"
openai = "kalash.models.providers.openai:OpenAIProvider"
openai_compatible = "kalash.models.providers.openai_compatible:OpenAICompatibleProvider"

[tool.hatch.build.targets.wheel]
packages = ["src/kalash"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "S", "B", "A", "C4", "DTZ", "T20", "ICN", "PIE", "PT", "RSE", "RET", "SLF", "SIM", "TCH", "ARG", "PTH", "ERA"]
ignore = ["S101", "S603", "S607"]

[tool.ruff.lint.isort]
known-first-party = ["kalash"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["kalash"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "e2e: end-to-end tests",
    "integration: integration tests",
    "invariant: invariant enforcement tests",
]
