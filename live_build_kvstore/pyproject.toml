[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kvstore"
version = "0.1.0"
description = "An embedded key-value store with TTL support and JSON persistence."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "kvstore contributors" }]
dependencies = [
    "typer>=0.12",
    "rich>=13",
]

[project.scripts]
kvstore = "kvstore.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/kvstore"]

[tool.hatch.build.targets.sdist]
include = ["src/kvstore", "tests", "pyproject.toml", "README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
