name: Checks

on:
  pull_request:
  push:

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13', '3.14']
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: System packages (sandbox + fast search)
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap ripgrep
          # Ubuntu 24.04 restricts unprivileged user namespaces, which bubblewrap needs.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - run: uv sync --frozen --extra dev --python ${{ matrix.python }}
      - name: Sandbox is usable (the sandbox tests must run, not skip)
        run: uv run kalash doctor | tee /dev/stderr | grep -q '\[ok  \] sandbox'
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run mypy src
      - run: uv run pytest -q
      - run: uv build
      - name: Installed-wheel smoke test (outside the source tree)
        run: |
          export KALASH_WHEEL="$(ls $PWD/dist/*.whl)"
          uv run pytest tests/process/test_wheel.py -q
