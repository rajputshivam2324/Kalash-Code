[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kalash-code"
version = "0.2.0"
description = "Terminal coding-agent harness: one loop, a durable session log, safe tools"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Kalash Team" }]
keywords = ["ai", "agent", "coding", "cli", "harness"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development",
]

# Providers are spoken to over plain HTTP (httpx); no vendor SDKs are required.
dependencies = [
    "cryptography>=43.0,<51.0",
    "httpx>=0.27.0,<1.0",
    "pydantic>=2.7.0,<3.0",
    "typer>=0.12.0,<1.0",
    "rich>=14.0,<16",
    "textual>=8.2,<9",
    "pyyaml>=6.0,<7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0,<9.0",
    "pytest-asyncio>=1.2,<2.0",
    "pytest-timeout==2.4.0",
    "mypy>=1.10.0,<2.0",
    "types-pyyaml>=6.0,<7.0",
    "ruff>=0.5.0,<1.0",
]

[project.scripts]
kalash = "kalash.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/kalash"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "PIE", "RSE", "RET", "SIM", "PT"]
ignore = ["PT011", "PT018", "N818"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501", "C408", "PT022"]

[tool.ruff.lint.isort]
known-first-party = ["kalash"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["kalash"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
timeout = 60
addopts = "--strict-markers"
markers = [
    "live: real provider API tests; skipped unless the provider key is set",
]
filterwarnings = ["error", "ignore::DeprecationWarning:textual.*"]
