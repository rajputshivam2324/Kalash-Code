name: Runtime checks

on:
  pull_request:
  push:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv
      - run: uv sync --frozen --all-extras
      - name: Core lint contracts
        run: uv run ruff check src tests evals --select F,I,UP
      - run: uv run ruff format --check src tests evals
      - run: uv run mypy src
      - run: uv run pytest -q
      - run: uv build
